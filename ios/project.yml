name: PaceLabCompanion
options:
  bundleIdPrefix: com.pacelab
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
    CODE_SIGN_STYLE: Automatic
targets:
  PaceLabCompanion:
    type: application
    platform: iOS
    sources:
      - path: PaceLabCompanion
        excludes:
          - WebApp/**
      - path: PaceLabCompanion/WebApp
        type: folder
        buildPhase: resources
      - path: PaceLabCompanion/AppData
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pacelab.healthcompanion
        INFOPLIST_KEY_CFBundleDisplayName: "PACE LAB"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSHealthShareUsageDescription: "PACE LAB lit les séances et le cardio pour ton suivi sportif local."
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: "PACE LAB ne modifie pas Apple Santé."
        CODE_SIGN_ENTITLEMENTS: PaceLabCompanion/PaceLabCompanion.entitlements
    info:
      path: PaceLabCompanion/Info.plist
      properties:
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [com.pacelab.healthcompanion.refresh]
        NSHealthShareUsageDescription: "PACE LAB lit les séances et les mesures cardiaques sur ton iPhone."
        NSHealthUpdateUsageDescription: "PACE LAB ne modifie pas Apple Santé."
