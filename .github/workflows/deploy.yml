name: PACE LAB · Validation et publication
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier l'application (sans données privées)
        run: |
          node tests/validate.mjs
          node tests/smoke.mjs
          node tests/healthkit-contract.mjs
          node --check assets/native-health.js
          node --check assets/app.js
          node --check assets/programme.js
      - name: Générer la version PWA
        run: |
          mkdir -p dist
          cp index.html manifest.webmanifest icon.svg sw.js .nojekyll dist/
          cp -R assets dist/
          sed -i "s/__PACE_LAB_BUILD__/${GITHUB_SHA}/g" dist/sw.js
      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5
      - name: Préparer la publication
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publier
        id: deployment
        uses: actions/deploy-pages@v4
